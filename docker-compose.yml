services:
  neo4j:
    image: neo4j:5.26-community
    container_name: diabetes-neo4j
    ports:   # chỉ mở cho máy này
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Hay dat NEO4J_PASSWORD trong file .env}
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
volumes:
  neo4j_data:
