<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .t{font-size:22px;font-weight:700;fill:#111827;text-anchor:middle}
      .s{font-size:14px;fill:#4b5563;text-anchor:middle}
      .l{stroke:#374151;stroke-width:2.2;fill:none;marker-end:url(#a)}
      .lab{font-size:14px;fill:#374151;font-style:italic}
      .data{fill:#eaf2fb;stroke:#2a78d6;stroke-width:2}
      .know{fill:#e9f7f1;stroke:#1b9e6f;stroke-width:2}
      .dec{fill:#fdf3e4;stroke:#d98a1f;stroke-width:2}
      .agent{fill:#efedfb;stroke:#6250d6;stroke-width:2.5}
      .out{fill:#f3f4f6;stroke:#374151;stroke-width:2.5}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#ffffff"/>
  <text x="700" y="42" class="t" font-size="26">Kiến trúc hệ đa agent hỗ trợ quản lý tiểu đường</text>

  <!-- DB -->
  <path class="data" d="M55,110 a125,22 0 0,0 250,0 v100 a125,22 0 0,1 -250,0 z"/>
  <ellipse class="data" cx="180" cy="110" rx="125" ry="22"/>
  <text x="180" y="172" class="t">DB có sẵn</text>
  <text x="180" y="196" class="s">diabetes.csv, CGM mô phỏng</text>

  <!-- Deep learning -->
  <rect class="data" x="370" y="115" width="260" height="90" rx="12"/>
  <text x="500" y="153" class="t">Deep learning</text>
  <text x="500" y="180" class="s">DiabetesNet (MLP), GlucoseLSTM</text>
  <path class="l" d="M307,160 H366"/>

  <!-- Dự đoán / Phân loại -->
  <rect class="data" x="730" y="70" width="250" height="76" rx="12"/>
  <text x="855" y="102" class="t">Dự đoán</text>
  <text x="855" y="126" class="s">đường huyết 30 phút tới</text>
  <rect class="data" x="730" y="176" width="250" height="76" rx="12"/>
  <text x="855" y="208" class="t">Phân loại</text>
  <text x="855" y="232" class="s">không / tiền / type 1 / type 2</text>
  <path class="l" d="M632,160 H680 V108 H726"/>
  <path class="l" d="M680,160 V214 H726"/>

  <!-- Web, sách -->
  <ellipse class="know" cx="170" cy="640" rx="115" ry="52"/>
  <text x="170" y="638" class="t">Web, sách</text>
  <text x="170" y="662" class="s">bài viết Vinmec (tóm tắt)</text>

  <!-- KB -->
  <rect class="know" x="60" y="330" width="240" height="120" rx="12"/>
  <text x="180" y="372" class="t">Knowledge base</text>
  <text x="180" y="398" class="s">Neo4j: khuyến nghị, thuốc,</text>
  <text x="180" y="418" class="s">thực phẩm, bệnh, bệnh nhân</text>
  <path class="l" d="M170,586 V454"/>
  <text x="182" y="525" class="lab">tạo</text>

  <!-- + và RAG -->
  <text x="340" y="378" class="t" font-size="30">+</text>
  <rect class="know" x="380" y="340" width="240" height="90" rx="12"/>
  <text x="500" y="378" class="t">RAG</text>
  <text x="500" y="404" class="s">BM25 / vector + LLM (tuỳ chọn)</text>
  <path class="l" d="M302,390 H376"/>

  <!-- Agent -->
  <rect class="agent" x="380" y="490" width="240" height="96" rx="12"/>
  <text x="500" y="528" class="t">Agent</text>
  <text x="500" y="554" class="s">Điều phối + 5 agent + Auditor</text>
  <path class="l" d="M500,432 V486"/>

  <!-- RL và Rule -->
  <rect class="dec" x="225" y="690" width="320" height="84" rx="12"/>
  <text x="385" y="726" class="t" font-size="20">Reinforcement learning</text>
  <text x="385" y="752" class="s">Q-learning đề xuất liều insulin</text>
  <rect class="dec" x="570" y="690" width="200" height="84" rx="12"/>
  <text x="670" y="726" class="t">Rule</text>
  <text x="670" y="752" class="s">luật an toàn, phủ quyết</text>
  <path class="l" d="M385,688 V640 H470 V590"/>
  <path class="l" d="M670,688 V640 H530 V590"/>

  <!-- Tư vấn / trợ giúp -->
  <rect class="out" x="800" y="400" width="500" height="250" rx="22"/>
  <circle cx="900" cy="485" r="34" fill="#ffffff" stroke="#374151" stroke-width="2.5"/>
  <path d="M846,600 a54,54 0 0,1 108,0 z" fill="#ffffff" stroke="#374151" stroke-width="2.5"/>
  <text x="1110" y="470" class="t" font-size="26">Tư vấn / trợ giúp</text>
  <text x="1110" y="505" class="s">Web + API cho người bệnh</text>
  <text x="1110" y="535" class="s">báo cáo, cảnh báo, gợi ý ăn uống,</text>
  <text x="1110" y="557" class="s">thuốc, vận động; hỏi đáp có nguồn</text>
  <path class="l" d="M622,538 H796"/>
  <path class="l" d="M855,254 V396"/>
  <path class="l" d="M982,108 H1110 V396"/>

  <text x="700" y="840" class="s" font-size="13">Công cụ hỗ trợ học tập, không phải thiết bị y tế, không thay thế bác sĩ.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
